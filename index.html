    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(circle at 50% 39%, rgba(255,255,255,.14), transparent 35%),
        linear-gradient(180deg, rgba(78, 18, 31, .06), rgba(123, 47, 16, .08));
      pointer-events: none;
    }

    .invite {
      width: min(91vw, 610px);
      position: relative;
      z-index: 5;
      margin-top: -2vh;
      padding: clamp(30px, 6vw, 54px) clamp(22px, 6vw, 52px);
      text-align: center;
      border: 1px solid rgba(157, 91, 44, .28);
      border-radius: 30px;
      background:
        linear-gradient(135deg, rgba(255,255,255,.94), rgba(255,247,224,.90));
      box-shadow:
        0 28px 80px rgba(92, 35, 18, .24),
        inset 0 0 0 8px rgba(255, 255, 255, .20);
      backdrop-filter: blur(6px);
      transform: translateY(28px) scale(.97);
      opacity: 0;
      animation: cardIn 1.15s .35s cubic-bezier(.2,.8,.2,1) forwards;
    }

    .invite::before,
    .invite::after {
      content: "✦";
      position: absolute;
      color: #cf7b19;
      font-size: 28px;
      opacity: .75;
    }

    .invite::before {
      top: 15px;
      left: 20px;
    }

    .invite::after {
      right: 20px;
      bottom: 15px;
    }

    @keyframes cardIn {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .eyebrow {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: #b55d35;
    }

    .join {
      margin-top: 14px;
      font-family: "Playfair Display", serif;
      font-size: clamp(20px, 4.3vw, 29px);
      color: #5e392f;
    }

    h1 {
      margin-top: 4px;
      font-family: "Great Vibes", cursive;
      font-weight: 400;
      font-size: clamp(58px, 12vw, 92px);
      line-height: .98;
      color: #b12d57;
      text-shadow: 0 4px 18px rgba(177, 45, 87, .10);
    }

    .ornament {
      width: 160px;
      max-width: 65%;
      height: 1px;
      margin: 23px auto;
      position: relative;
      background: linear-gradient(90deg, transparent, #c98d3c, transparent);
    }

    .ornament::after {
      content: "❀";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      padding: 0 9px;
      background: #fff7e5;
      color: #e18422;
      font-size: 16px;
    }

    .date {
      font-family: "Playfair Display", serif;
      font-size: clamp(22px, 5vw, 33px);
      font-weight: 600;
      line-height: 1.35;
      color: #663528;
    }

    .time {
      margin-top: 12px;
      font-family: "Playfair Display", serif;
      font-size: clamp(28px, 6vw, 42px);
      font-weight: 700;
      color: #d76718;
    }

    .venue {
      margin-top: 17px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 11px 18px;
      border: 1px solid rgba(176, 74, 54, .17);
      border-radius: 999px;
      background: rgba(255, 232, 181, .62);
      font-family: "Playfair Display", serif;
      font-size: clamp(18px, 4.5vw, 25px);
      color: #7d4030;
    }

    .note {
      margin: 22px auto 0;
      max-width: 390px;
      font-size: 10px;
      line-height: 1.7;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: #8d6759;
    }

    /* Sparkles */
    .sparkles {
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      overflow: hidden;
    }

    .spark {
      position: absolute;
      width: var(--size);
      height: var(--size);
      left: var(--x);
      top: -8vh;
      opacity: 0;
      border-radius: 50%;
      background: var(--color);
      box-shadow: 0 0 14px var(--color);
      animation:
        fall var(--dur) var(--delay) cubic-bezier(.15,.65,.35,1) forwards,
        twinkle .75s var(--delay) ease-in-out infinite alternate;
    }

    .spark.star {
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }

    .spark.star::before {
      content: "✦";
      position: absolute;
      inset: 50% auto auto 50%;
      transform: translate(-50%, -50%);
      color: var(--color);
      font-size: calc(var(--size) * 1.65);
      text-shadow: 0 0 12px var(--color);
    }

    @keyframes fall {
      0% {
        transform: translate3d(0, -5vh, 0) rotate(0deg) scale(.4);
        opacity: 0;
      }
      10% {
        opacity: .95;
      }
      78% {
        opacity: .85;
      }
      100% {
        transform: translate3d(var(--drift), 108vh, 0) rotate(520deg) scale(1);
        opacity: 0;
      }
    }

    @keyframes twinkle {
      from { filter: brightness(.9); }
      to { filter: brightness(1.5); }
    }

    .music-control {
      position: fixed;
      right: 16px;
      top: 16px;
      z-index: 40;
      min-height: 42px;
      padding: 0 14px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(255,255,255,.55);
      border-radius: 999px;
      background: rgba(86, 30, 30, .72);
      color: #fff9e8;
      font-family: "Montserrat", sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .04em;
      box-shadow: 0 12px 30px rgba(60, 20, 15, .2);
      backdrop-filter: blur(10px);
      cursor: pointer;
      transition: transform .2s ease, background .2s ease;
    }

    .music-control:hover {
      transform: translateY(-2px);
      background: rgba(118, 38, 38, .85);
    }

    .music-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ffd34e;
      box-shadow: 0 0 0 0 rgba(255, 211, 78, .55);
      animation: musicPulse 1.5s infinite;
    }

    .music-control.paused .music-dot {
      animation: none;
      opacity: .45;
    }

    @keyframes musicPulse {
      70% {
        box-shadow: 0 0 0 8px rgba(255, 211, 78, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(255, 211, 78, 0);
      }
    }

    .autoplay-hint {
      position: fixed;
      left: 50%;
      bottom: 18px;
      z-index: 45;
      transform: translateX(-50%) translateY(20px);
      width: min(88vw, 360px);
      padding: 11px 14px;
      border-radius: 14px;
      background: rgba(88, 31, 29, .88);
      color: #fff9ea;
      text-align: center;
      font-size: 10px;
      line-height: 1.45;
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s ease, transform .3s ease;
    }

    .autoplay-hint.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 600px) {
      .page {
        background-position: center top;
        padding: 84px 13px 40px;
      }

      .invite {
        margin-top: 0;
        padding: 31px 20px 34px;
        border-radius: 24px;
      }

      .music-control {
        top: 12px;
        right: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .spark {
        display: none;
      }
      .invite {
        animation: none;
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>

<body>
  <div class="sparkles" id="sparkles" aria-hidden="true"></div>

  <button class="music-control paused" id="musicControl" type="button" aria-label="Toggle background music">
    <span class="music-dot"></span>
    <span id="musicLabel">Play Music</span>
  </button>

  <div class="autoplay-hint" id="autoplayHint">
    Tap “Play Music” if your browser blocks automatic sound.
  </div>

  <audio id="bgMusic" src="music file.mp3" preload="auto"></audio>

  <main class="page">
    <section class="invite" aria-label="Dholki invitation">
      <div class="eyebrow">A joyful evening of music & celebration</div>
      <div class="join">Please join us for</div>
      <h1>Furqan &amp; Laiba's Dholki</h1>

      <div class="ornament"></div>

      <div class="date">Saturday, 17th October 2026</div>
      <div class="time">9:00 PM</div>
      <div class="venue">✦ At My Home ✦</div>

      <p class="note">
        Come celebrate with colours, laughter, dholki beats and beautiful memories.
      </p>
    </section>
  </main>

  <script>
    const music = document.getElementById("bgMusic");
    const musicControl = document.getElementById("musicControl");
    const musicLabel = document.getElementById("musicLabel");
    const autoplayHint = document.getElementById("autoplayHint");
    const sparkles = document.getElementById("sparkles");

    const LOOP_END = 15;

    function setMusicUI(isPlaying) {
      musicControl.classList.toggle("paused", !isPlaying);
      musicLabel.textContent = isPlaying ? "Music On" : "Play Music";
    }

    // Repeat only the first 15 seconds forever.
    music.addEventListener("timeupdate", () => {
      if (music.currentTime >= LOOP_END) {
        music.currentTime = 0;
        music.play().catch(() => {});
      }
    });

    music.addEventListener("ended", () => {
      music.currentTime = 0;
      music.play().catch(() => {});
    });

    music.addEventListener("play", () => setMusicUI(true));
    music.addEventListener("pause", () => setMusicUI(false));

    musicControl.addEventListener("click", async () => {
      try {
        if (music.paused) {
          if (music.currentTime >= LOOP_END) music.currentTime = 0;
          await music.play();
          autoplayHint.classList.remove("show");
        } else {
          music.pause();
        }
      } catch (error) {
        autoplayHint.classList.add("show");
      }
    });

    async function tryAutoplay() {
      try {
        music.currentTime = 0;
        await music.play();
        autoplayHint.classList.remove("show");
      } catch (error) {
        setMusicUI(false);
        setTimeout(() => autoplayHint.classList.add("show"), 1200);
      }
    }

    function createSparkles() {
      const colors = [
        "#ffcf3f", "#ff7a1a", "#ef3f75",
        "#d91f57", "#67a94f", "#8f4dc6",
        "#ffef9c", "#f39c34"
      ];

      const count = window.innerWidth < 600 ? 42 : 68;

      for (let i = 0; i < count; i++) {
        const el = document.createElement("span");
        el.className = "spark" + (Math.random() > 0.55 ? " star" : "");

        const size = 4 + Math.random() * 8;
        const x = Math.random() * 100;
        const duration = 2.8 + Math.random() * 3.3;
        const delay = Math.random() * 1.8;
        const drift = (-90 + Math.random() * 180) + "px";
        const color = colors[Math.floor(Math.random() * colors.length)];

        el.style.setProperty("--size", size + "px");
        el.style.setProperty("--x", x + "vw");
        el.style.setProperty("--dur", duration + "s");
        el.style.setProperty("--delay", delay + "s");
        el.style.setProperty("--drift", drift);
        el.style.setProperty("--color", color);

        sparkles.appendChild(el);

        setTimeout(() => el.remove(), (duration + delay + 0.5) * 1000);
      }
    }

    window.addEventListener("load", () => {
      createSparkles();
      tryAutoplay();

      // One softer second sparkle burst.
      setTimeout(createSparkles, 2600);
    });

    // Any first user interaction is also a valid chance to start audio.
    const unlockAudio = async () => {
      if (music.paused) {
        try {
          if (music.currentTime >= LOOP_END) music.currentTime = 0;
          await music.play();
          autoplayHint.classList.remove("show");
        } catch (e) {}
      }
      document.removeEventListener("pointerdown", unlockAudio);
      document.removeEventListener("keydown", unlockAudio);
    };

    document.addEventListener("pointerdown", unlockAudio, { once: true });
    document.addEventListener("keydown", unlockAudio, { once: true });
  </script>
</body>
</html>
