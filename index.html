    .scene::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 34%, rgba(255,255,255,.18), transparent 36%),
        linear-gradient(180deg, rgba(73,20,35,.04), rgba(80,31,16,.08));
    }

    .spark-layer {
      position: fixed;
      inset: 0;
      z-index: 50;
      pointer-events: none;
      overflow: hidden;
    }

    .spark {
      position: absolute;
      top: -8vh;
      left: var(--x);
      width: var(--size);
      height: var(--size);
      opacity: 0;
      border-radius: 50%;
      background: var(--color);
      box-shadow: 0 0 14px var(--color);
      animation: fall var(--dur) var(--delay) cubic-bezier(.15,.65,.35,1) forwards;
    }

    .spark.star {
      width: auto;
      height: auto;
      background: transparent;
      box-shadow: none;
      border-radius: 0;
    }

    .spark.star::before {
      content: "✦";
      color: var(--color);
      font-size: calc(var(--size) * 1.75);
      text-shadow: 0 0 12px var(--color);
    }

    @keyframes fall {
      0% {
        transform: translate3d(0,-4vh,0) rotate(0deg) scale(.5);
        opacity: 0;
      }
      12% { opacity: .95; }
      82% { opacity: .85; }
      100% {
        transform: translate3d(var(--drift),110vh,0) rotate(520deg) scale(1);
        opacity: 0;
      }
    }

    .intro-screen,
    .invite-screen {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      transition:
        opacity .85s ease,
        transform .85s cubic-bezier(.2,.75,.2,1),
        visibility .85s ease;
    }

    .intro-screen {
      z-index: 20;
      opacity: 1;
      visibility: visible;
      transform: scale(1);
    }

    .intro-screen.hide {
      opacity: 0;
      visibility: hidden;
      transform: scale(1.05);
    }

    .invite-screen {
      z-index: 10;
      opacity: 0;
      visibility: hidden;
      transform: translateY(28px) scale(.98);
    }

    .invite-screen.show {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
    }

    .intro-card {
      width: min(90vw, 520px);
      padding: 34px 26px 30px;
      text-align: center;
      border: 1px solid rgba(164, 100, 50, .27);
      border-radius: 30px;
      background:
        linear-gradient(180deg, rgba(255,250,235,.95), rgba(255,244,216,.91));
      box-shadow:
        0 28px 80px rgba(82, 34, 20, .24),
        inset 0 0 0 7px rgba(255,255,255,.18);
      backdrop-filter: blur(5px);
    }

    .intro-kicker {
      font-family: "Playfair Display", serif;
      font-size: 19px;
      color: #754235;
    }

    .drum-button {
      margin: 19px auto 18px;
      width: 190px;
      height: 150px;
      display: grid;
      place-items: center;
      position: relative;
      border: 0;
      border-radius: 34px;
      cursor: pointer;
      background:
        radial-gradient(circle at 50% 45%, rgba(255,212,100,.34), transparent 58%),
        rgba(255,255,255,.25);
      transition: transform .25s ease;
    }

    .drum-button:hover {
      transform: translateY(-4px) scale(1.03);
    }

    .drum {
      font-size: 104px;
      line-height: 1;
      filter: drop-shadow(0 15px 16px rgba(111,45,18,.24));
      animation: drumBeat .82s ease-in-out infinite;
      transform-origin: 50% 72%;
    }

    .drum-button::before,
    .drum-button::after {
      content: "✦";
      position: absolute;
      color: #ef8f25;
      font-size: 24px;
      animation: twinkle 1.2s ease-in-out infinite alternate;
    }

    .drum-button::before {
      left: 9px;
      top: 16px;
    }

    .drum-button::after {
      right: 10px;
      bottom: 14px;
      animation-delay: .35s;
    }

    @keyframes drumBeat {
      0%,100% { transform: rotate(-2deg) scale(1); }
      35% { transform: rotate(2deg) scale(1.045); }
      55% { transform: rotate(-1deg) scale(.985); }
    }

    @keyframes twinkle {
      from { opacity: .45; transform: scale(.85) rotate(0deg); }
      to { opacity: 1; transform: scale(1.18) rotate(24deg); }
    }

    .tap-title {
      font-family: "Great Vibes", cursive;
      font-size: clamp(42px, 9vw, 62px);
      color: #b73358;
      line-height: 1;
    }

    .tap-sub {
      margin-top: 9px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .19em;
      text-transform: uppercase;
      color: #8a6256;
    }

    .invite-card {
      width: min(91vw, 620px);
      padding: clamp(34px, 6vw, 58px) clamp(22px, 6vw, 52px);
      text-align: center;
      border: 1px solid rgba(168,102,53,.30);
      border-radius: 32px;
      background:
        radial-gradient(circle at 50% 0, rgba(255,255,255,.9), transparent 35%),
        linear-gradient(180deg, rgba(255,250,237,.96), rgba(255,242,215,.93));
      box-shadow:
        0 30px 90px rgba(85, 34, 18, .24),
        inset 0 0 0 8px rgba(255,255,255,.22);
      backdrop-filter: blur(6px);
    }

    .invite-card::before {
      content: "❀  ✦  ❀";
      display: block;
      margin-bottom: 12px;
      letter-spacing: .45em;
      color: #d78428;
      font-size: 15px;
    }

    .join {
      font-family: "Playfair Display", serif;
      font-size: clamp(19px, 4.4vw, 28px);
      color: #604039;
    }

    h1 {
      margin-top: 8px;
      font-family: "Great Vibes", cursive;
      font-size: clamp(58px, 12vw, 90px);
      font-weight: 400;
      line-height: .98;
      color: #b92d59;
      text-shadow: 0 5px 18px rgba(185,45,89,.1);
    }

    .mini-drum {
      margin: 16px auto 8px;
      font-size: 64px;
      animation: drumBeat .88s ease-in-out infinite;
      filter: drop-shadow(0 8px 9px rgba(111,45,18,.16));
    }

    .line {
      width: 170px;
      max-width: 62%;
      height: 1px;
      margin: 18px auto;
      background: linear-gradient(90deg,transparent,#d99a4a,transparent);
    }

    .date {
      font-family: "Playfair Display", serif;
      font-size: clamp(22px, 5vw, 31px);
      font-weight: 600;
      line-height: 1.4;
      color: #60362f;
    }

    .time {
      margin-top: 13px;
      font-family: "Playfair Display", serif;
      font-size: clamp(29px, 6vw, 42px);
      font-weight: 700;
      color: #d66b1d;
    }

    .venue {
      margin-top: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 18px;
      border: 1px solid rgba(184,92,54,.17);
      border-radius: 999px;
      background: rgba(255,229,177,.62);
      font-family: "Playfair Display", serif;
      font-size: clamp(18px, 4.5vw, 25px);
      color: #7b4033;
    }

    .music-toggle {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 80;
      min-height: 42px;
      padding: 0 14px;
      display: none;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(255,255,255,.48);
      border-radius: 999px;
      background: rgba(96,31,37,.78);
      color: #fff9e9;
      font: 600 10px "Montserrat", sans-serif;
      letter-spacing: .05em;
      cursor: pointer;
      backdrop-filter: blur(9px);
      box-shadow: 0 12px 28px rgba(61,21,18,.22);
    }

    .music-toggle.visible {
      display: inline-flex;
    }

    .music-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ffd35b;
      animation: pulse 1.4s infinite;
    }

    .music-toggle.paused .music-dot {
      animation: none;
      opacity: .45;
    }

    @keyframes pulse {
      70% { box-shadow: 0 0 0 8px rgba(255,211,91,0); }
      100% { box-shadow: 0 0 0 0 rgba(255,211,91,0); }
    }

    @media (max-width: 600px) {
      .scene {
        background-position: center top;
      }

      .intro-card {
        padding: 28px 18px 25px;
      }

      .drum-button {
        width: 165px;
        height: 132px;
      }

      .drum {
        font-size: 90px;
      }

      .invite-card {
        border-radius: 25px;
        padding: 34px 18px 36px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .drum,
      .mini-drum,
      .spark {
        animation: none !important;
      }

      .intro-screen,
      .invite-screen {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <div class="spark-layer" id="sparkLayer" aria-hidden="true"></div>

  <div class="scene">
    <section class="intro-screen" id="introScreen">
      <div class="intro-card">
        <div class="intro-kicker">A joyful evening awaits</div>

        <button class="drum-button" id="openInvite" type="button" aria-label="Open Dholki invitation">
          <div class="drum">🪘</div>
        </button>

        <div class="tap-title">Tap the Dholki to Open</div>
        <div class="tap-sub">Furqan &amp; Laiba</div>
      </div>
    </section>

    <section class="invite-screen" id="inviteScreen">
      <div class="invite-card">
        <div class="join">Please join us for</div>
        <h1>Furqan &amp; Laiba’s Dholki</h1>

        <div class="mini-drum">🪘</div>
        <div class="line"></div>

        <div class="date">Saturday, 17th October 2026</div>
        <div class="time">9:00 PM</div>
        <div class="venue">At My Home</div>
      </div>
    </section>
  </div>

  <button class="music-toggle paused" id="musicToggle" type="button">
    <span class="music-dot"></span>
    <span id="musicLabel">Music On</span>
  </button>

  <audio id="bgMusic" src="music file.mp3" preload="auto"></audio>

  <script>
    const introScreen = document.getElementById("introScreen");
    const inviteScreen = document.getElementById("inviteScreen");
    const openInvite = document.getElementById("openInvite");
    const sparkLayer = document.getElementById("sparkLayer");

    const music = document.getElementById("bgMusic");
    const musicToggle = document.getElementById("musicToggle");
    const musicLabel = document.getElementById("musicLabel");

    const LOOP_END = 13;
    let opened = false;

    function setMusicUI(isPlaying) {
      musicToggle.classList.toggle("paused", !isPlaying);
      musicLabel.textContent = isPlaying ? "Music On" : "Play Music";
    }

    music.addEventListener("timeupdate", () => {
      if (music.currentTime >= LOOP_END) {
        music.currentTime = 0;
        music.play().catch(() => {});
      }
    });

    music.addEventListener("ended", () => {
      music.currentTime = 0;
      music.play().catch(() => {});
    });

    music.addEventListener("play", () => setMusicUI(true));
    music.addEventListener("pause", () => setMusicUI(false));

    musicToggle.addEventListener("click", async () => {
      if (music.paused) {
        if (music.currentTime >= LOOP_END) music.currentTime = 0;
        try {
          await music.play();
        } catch (e) {}
      } else {
        music.pause();
      }
    });

    function createSparkles(count = 58) {
      const colors = [
        "#ffd34e", "#ff7b1b", "#ef3f78",
        "#ca2457", "#72a947", "#9d4dba",
        "#fff0a0", "#f09a36"
      ];

      for (let i = 0; i < count; i++) {
        const el = document.createElement("span");
        el.className = "spark" + (Math.random() > .53 ? " star" : "");

        const size = 4 + Math.random() * 8;
        const duration = 2.7 + Math.random() * 3.4;
        const delay = Math.random() * 1.2;
        const drift = (-100 + Math.random() * 200) + "px";

        el.style.setProperty("--x", (Math.random() * 100) + "vw");
        el.style.setProperty("--size", size + "px");
        el.style.setProperty("--dur", duration + "s");
        el.style.setProperty("--delay", delay + "s");
        el.style.setProperty("--drift", drift);
        el.style.setProperty("--color", colors[Math.floor(Math.random() * colors.length)]);

        sparkLayer.appendChild(el);

        setTimeout(
          () => el.remove(),
          (duration + delay + .7) * 1000
        );
      }
    }

    openInvite.addEventListener("click", async () => {
      if (opened) return;
      opened = true;

      createSparkles(window.innerWidth < 600 ? 44 : 68);

      // User interaction makes audio start reliable in modern browsers.
      try {
        music.currentTime = 0;
        await music.play();
      } catch (e) {}

      musicToggle.classList.add("visible");

      introScreen.classList.add("hide");

      setTimeout(() => {
        inviteScreen.classList.add("show");
      }, 350);

      setTimeout(() => {
        createSparkles(window.innerWidth < 600 ? 28 : 42);
      }, 1300);
    });
  </script>
</body>
</html>
